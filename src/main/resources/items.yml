# ---- Basic Archer Set (item set bonus: full 4/4 set) -----------------------
# Full set passive: +10% projectile damage dealt (arrows, projectiles and the
# Bonemerang) plus extra attack damage. While wearing all four pieces, the
# player's projectile damage is amplified; breaking the set removes the bonus.
item-sets:
  BASIC_ARCHER:
    name: Basic Archer Set
    pieces:
    - BASIC_ARCHER_HELMET
    - BASIC_ARCHER_CHESTPLATE
    - BASIC_ARCHER_LEGGINGS
    - BASIC_ARCHER_BOOTS
    bonuses:
      '4':
        description: |-
          Full Archer Set (4/4):
          +10% Projectile Damage, +10 Attack Damage
        stat-modifiers:
        - amount: 10.0
          statType: PROJECTILE_DAMAGE
          modifierType: FLAT
          statTarget: BOTH
          policy: STACK
        - amount: 10.0
          statType: ATTACK_DAMAGE
          modifierType: FLAT
          statTarget: BOTH
          policy: STACK
        passives: []
        abilities: []
  
  # ---- Basic Tank Set (item set bonus: full 4/4 set) --------------------------
  # Full set passive THREAT: mobs that pick a target near the wearer switch to
  # the wearer with a chance. Plus defensive stats.
  BASIC_TANK:
    name: Basic Tank Set
    pieces:
    - BASIC_TANK_HELMET
    - BASIC_TANK_CHESTPLATE
    - BASIC_TANK_LEGGINGS
    - BASIC_TANK_BOOTS
    bonuses:
      '4':
        description: |-
          Full Tank Set (4/4):
          +100 Max Health, +20 Armor, +10 Magic Resist,
          draws monster aggression
        stat-modifiers:
        - amount: 100.0
          statType: HEALTH_MAX
          modifierType: FLAT
          statTarget: BOTH
          policy: STACK
        - amount: 20.0
          statType: ARMOR
          modifierType: FLAT
          statTarget: BOTH
          policy: STACK
        - amount: 10.0
          statType: MAGIC_RESIST
          modifierType: FLAT
          statTarget: BOTH
          policy: STACK
        passives:
        - THREAT
        abilities: []

  # ---- Drain Tank Set (item set bonus: full 4/4 set) -------------------------
  # Full set passive VAMPIRISM: every enemy death within 10 blocks heals the
  # wearer for 5% of their max health — but only while in active combat
