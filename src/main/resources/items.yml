        - amount: 100.0
          statType: HEALTH_MAX
          modifierType: FLAT
          statTarget: BOTH
          policy: STACK
        passives:
        - VAMPIRISM
        abilities: []
  
  # ---- Basic Assassin Set (item set bonus: full 4/4 set) ----------------------
