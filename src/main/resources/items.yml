# ============================================================================
# ITEMS CONFIGURATION
# ============================================================================
# Each entry under `items:` is an RPG item usable in the item draft (the shop
# opened during the SelectItemState). Mobs can also equip any item by id.
#
# Full list of supported keys (all optional unless noted):
#
#   name            Display name shown on the item stack (defaults to the id).
#   material        Vanilla Bukkit Material of the item (e.g. DIAMOND_SWORD).
#   leather-color   RGB tint for leather armor (LEATHER_HELMET/CHESTPLATE/
#                   LEGGINGS/BOOTS). Accepts "#RRGGBB", "0xRRGGBB" or a decimal
#                   integer (e.g. 16711680). Absent = default brown leather.
#   skull-owner     Player name whose skin is shown on a PLAYER_HEAD item.
#                   Ignored when skull-texture is set.
#   skull-texture   Base64 "textures" value for a fully custom PLAYER_HEAD skin
#                   (get one from a head database like mineskin.org). Takes
#                   precedence over skull-owner. Requires a PLAYER_HEAD
#                   material.
#   slot            Equipment slot, one of: HEAD, CHEST, LEGS, FEET,
#                   MAIN_HAND, OFF_HAND (defaults to MAIN_HAND).
#                   HEAD/CHEST/LEGS/FEET slots are armor: players may take one
#                   piece per slot for free and it never counts against their
#                   item limit. MAIN_HAND/OFF_HAND picks cost the item limit.
#   itemType        Broad item category used by gameplay systems (e.g. bows
#                   arm the unlimited-arrow mechanic). One of: SWORD, AXE, BOW,
#                   STAFF, MISC, ORB, THROWABLE, SHIELD, HELMET, CHESTPLATE,
#                   LEGGINGS, BOOTS (defaults to MISC). Future types will be
#                   added here.
#   requiresArrows  Whether holding this item arms the unlimited-arrows
#                   mechanic (a hidden arrow stack is kept in the inventory
#                   while it is held so vanilla shooting never runs dry).
#                   Defaults to TRUE for itemType: BOW, false otherwise;
#                   special bows that fire without arrows (e.g. the Bonemerang)
#                   explicitly set it to false.
#   unlockLevel     Minimum player level (active class) needed to obtain the
#                   item. 0 or absent = no requirement. Items a player has not
#                   unlocked yet appear as locked barrier stacks in the shop.
#   usage           "both" (default, players + mobs) or "mob_only" (mobs only;
#                   never listed or obtainable by players).
#   allowed-classes List of classes that may select this item, e.g. [TANK, MAGE].
#                   Empty/absent = all classes.
#   description     Lore lines shown on the item.
#   passive-stats   Stats granted while the item is just owned (see stats.yml
#                   for stat types).
#   active-stats    Stats granted when the item is actively used/equipped.
#   abilities       Ability ids from abilities.yml cast by the item (e.g. when
#                   a mob swings it or a player uses it).
#
# Stat modifier keys (used inside passive-stats / active-stats):
#   amount          Modifier value (flat or percent).
#   statType        One of the stat types in stats.yml (e.g. ATTACK_DAMAGE,
#                   ARMOR, CRIT_CHANCE, PROJECTILE_DAMAGE).
#   modifierType    FLAT (adds the amount) or PERCENT_ADD (percent increase).
#   statTarget      BOTH.
#   policy          STACK (each source stacks) or one of the stack policies in
#                   dev.core.stat.stackpolicy (e.g. MAX_ONLY, REPLACE).
#   priority        Sort order for conflicting modifiers.
#
# ---- Item sets ----
# The `item-sets:` section groups item ids into sets. A set's bonus kicks in
# when at least `N` pieces of that set are equipped by the same entity at the
# same time (armor slots count individually). Each bonus may carry stat
# modifiers (same keys as item stats), passive abilities and/or abilities.
#
#   item-sets:
#     MY_SET:
#       name: My Set
#       pieces: [MY_HELMET, MY_CHESTPLATE]   # item ids from `items:` above
#       bonuses:
#         "2":                                # piece count -> bonus
#           description: 2/2 set bonus text
#           stat-modifiers:
#           - amount: 10.0
#             statType: PROJECTILE_DAMAGE     # percent: 10 = +10% projectile damage
#             modifierType: FLAT
#             statTarget: BOTH
#             policy: STACK
#           passives: []                      # passive ability ids (see below)
#           abilities: []
#
# Set passives are resolved through SetPassiveRegistry; unknown ids are logged
# and skipped. Built-in passives:
#   THREAT      (Tank)    monsters picked a target nearby switch to the wearer
#                         with a chance (up to 10 blocks away)
#   BACKSTAB    (Assassin) melee & ability-cast damage +50% when the wearer
#                         strikes an enemy from behind
#   HEAL_AURA   (Support) every second the wearer heals alive non-ghost
#                         teammates within 6 blocks
#   MANA_DISCOUNT (Mage) ability casts cost 10% less mana while the full set
#                         is worn (applied to mana costs at cast time)
# Cooldown reduction (Mage) is a plain stat bonus: ABILITY_HASTE.
#
# PROJECTILE_DAMAGE is a percent stat: it amplifies the damage of whatever
# projectile the holder attacks with (arrows, tridents, fireballs, ... and the
# Bonemerang's bone), so FLAT 10.0 = +10%.
#
# Example item:
#   MY_SWORD:
#     name: My Sword
#     material: IRON_SWORD
#     slot: MAIN_HAND
#     itemType: SWORD
#     unlockLevel: 3
#     allowed-classes: [TANK]
#     passive-stats:
#     - amount: 5.0
#       statType: ARMOR
#       modifierType: FLAT
#       statTarget: BOTH
#       policy: STACK
#     active-stats: []
#     abilities: []
#
# Visual customization examples:
#   MAGE_ROBE:
#     name: Mage Robe
#     material: LEATHER_CHESTPLATE
#     slot: CHEST
#     leather-color: "#3366FF"   # or 0x3366FF / 3368703
#     active-stats: []
#     abilities: []
#   DRAGON_HEAD:
#     name: Dragon Head
#     material: PLAYER_HEAD
#     slot: HEAD
#     skull-texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvY2ZmZWMzfX19
#     abilities: []
# ============================================================================
