# ============================================================================
# BOSS REWARD CASE CONFIGURATION
# ============================================================================
# The reward case is rolled after a boss encounter. Each reward entry has a
# weight; higher weights are more likely.
#
# Reward types:
#   CLASS_XP_DYE  Visual blue dye icon. On claim it grants class XP to the
#                 player's active class. No physical item is given.
#   ITEM_UNLOCK   Permanently unlocks a reward-only RPG item from items.yml
#                 (reward-only: true). Item unlocks are removed from a player's
#                 pool once they own them.
#
# Settings:
#   roll-min-seconds / roll-max-seconds
#       The reel duration is rolled uniformly inside this interval. Duration
#       only controls how long the roll lasts; it does not change the top
#       speed. Longer rolls travel farther before their late deceleration.
#   roll-top-speed
#       Peak reel speed in items (slots) per second. This is independent of
#       the duration. Raise it for a faster spin, lower it for a slower one.
#
# Reward entry keys:
#   type          CLASS_XP_DYE or ITEM_UNLOCK
#   weight        Relative roll weight (must be positive)
#   display-name  Name shown on the case icon
#   description   Lore lines for the icon
#   xp-min/xp-max XP range for CLASS_XP_DYE
#   item-id       RPG item id for ITEM_UNLOCK
#   give-item     Whether an ITEM_UNLOCK also gives a physical copy (default true)
# ============================================================================
settings:
  roll-min-seconds: 10.0
  roll-max-seconds: 13.5
  roll-top-speed: 12.0

rewards:
  DYE_COMMON:
    type: CLASS_XP_DYE
    weight: 42
    xp-min: 40
    xp-max: 90
    display-name: Azure Dye
    description:
    - "§7A fragment of sealed energy."
    - "§7The shade shifts like deep water."
  DYE_RARE:
    type: CLASS_XP_DYE
    weight: 28
    xp-min: 90
    xp-max: 160
    display-name: Cerulean Dye
    description:
    - "§7A brighter shard of the seal."
  DYE_EPIC:
    type: CLASS_XP_DYE
    weight: 15
    xp-min: 160
    xp-max: 260
    display-name: Abyssal Dye
    description:
    - "§7The seal remembers those who break it."
  UNLOCK_SLIME_BOOTS:
    type: ITEM_UNLOCK
    weight: 10
    display-name: Slime Boots
    item-id: SLIME_BOOTS
    give-item: true
  UNLOCK_GAMBLERS_NOTE:
    type: ITEM_UNLOCK
    weight: 8
    display-name: Gambler's Note
    item-id: GAMBLERS_NOTE
    give-item: true
  UNLOCK_TELEPORTATION_INCIDENT:
    type: ITEM_UNLOCK
    weight: 8
    display-name: Teleportation Incident
    item-id: TELEPORTATION_INCIDENT
    give-item: true
  UNLOCK_TIC_TAC_TOE:
    type: ITEM_UNLOCK
    weight: 7
    display-name: Tic Tac Toe
    item-id: TIC_TAC_TOE
    give-item: true
  UNLOCK_TELEPORTATION_STAFF:
    type: ITEM_UNLOCK
    weight: 6
    display-name: Teleportation Staff
    item-id: TELEPORTATION_STAFF
    give-item: true
