# ============================================================================
# STATS CONFIGURATION
# ============================================================================
# NONE is the universal base stat set that every entity starts from (players
# before class selection, mobs and bosses without their own stats).
# Each class block is a BONUS layered on top of that base, scaled by level.
#
# The stat key names below (HEALTH_MAX, MANA_MAX, ARMOR, ...) are also the
# variable names available in dynamic ability cost formulas — see the
# "COST FORMULAS" section of abilities.yml, e.g.:
#   cost:
#     mode: MANA
#     formula: "10 + 0.05 * MANA_MAX"
statDefaults:
  NONE:
    HEALTH_MAX: 100
    MANA_MAX: 100
    ARMOR: 10
    MAGIC_RESIST: 10
    ATTACK_DAMAGE: 5
    ABILITY_POWER: 0
