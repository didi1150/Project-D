# Per-floor boss definitions.
# The first boss defined for a floor is the boss that spawns on that floor.
#
# Stage types:
#   THRESHOLD  - applies movement/targeting/attack strategies, transitions when
#                health falls to `health-threshold` (0.75 = 75% remaining HP)
#   MONOLOGUE  - final stage; broadcasts `lines` at `tick-delay` intervals, then
#                the boss is defeated (used with `defeat-stage`)
#   SUMMON     - spawns `summon-entity` minions every `interval-ticks` for
#                `duration-ticks`, then transitions to `next-stage`
#   GROW       - sealed ascent: intro rise, pillar-health-scaled ascent, then
#                transitions to `wipe-stage` on failure. Reaching 0% height after
#                the intro ends the encounter as a victory. Stalactite hits push
#                the boss down by `stalactite-push-percent`; ground impacts deal
#                `stalactite-explosion-percent` of max health in a 10-block radius.
#   WIPE       - failure cinematic; pulls the party above a pentagram, raises the
#                Sealed Hand, kills all players and ends the encounter.
#
# Strategy keys:
#   movement:  NONE, PATHFIND, TELEPORT
#   targeting: NONE, FIRST_ALIVE, NEAREST
#   attack:    NONE, MELEE, WITHER_SKULL
#
# Strategy parameters (read from the stage section):
#   attack-count / attack-cooldown-ms        (WITHER_SKULL)
#   movement-speed / stop-distance           (PATHFIND)
#   teleport-distance / teleport-cooldown-ms (TELEPORT)
#
# Floor-specific metadata:
#   Top-level `floor-data` holds free-form per-floor key-values handled manually
#   by floor-specific stage code. Each floor key is an integer floor number.
#   Helpers in FloorData (getViewPointList etc.) parse locations shaped as:
#     { x: <int>, y: <int>, z: <int>, world: <string>, yaw: <float>, pitch: <float> }
#   Reload live via /d boss reload (bosses.yml + floor-data).
#   Fail-fast: stages validate required keys in onEnter and broadcast if missing.

bosses:
  1:
    sealed-entity:
      display-name: "&c&lThe Sealed Entity"
      entity-type: WITHER
      stats:
        HEALTH_MAX: 1000
        MANA_MAX: 100
        ARMOR: 0
        MAGIC_RESIST: 0
        ATTACK_DAMAGE: 0
        ATTACK_SPEED: 1.0
        MOVE_SPEED: 100
        HEALTH_REGEN: 0
        MANA_REGEN: 0
        CRIT_CHANCE: 0.0
        LETHALITY: 0
        ARMOR_PENETRATION: 0
      stages:
        - type: GROW
          id: grow
          intro-ticks: 80
          buried-depth: 2.0
          half-height: 8.0
          full-height: 16.0
          ascent-base-rate: 0.15
          ascent-max-rate: 1.5
          pillar-count: 4
          pillar-max-hp: 100.0
          pillar-height: 12
          pillar-break-ticks: 40
          pillar-hold-threshold: 0.95
          repair-hp-per-resource: 10.0
          mob-damage-scale: 1.0
          siege-aggro-percent: 40.0
          siege-aggro-interval-ticks: 40
          chain-taut-sag: 0.02
          chain-slack-sag: 0.45
          # Arena layout for this stage. Edited in-game with the Boss Setup tools
          # (/d bossSetup toggleSetupMode 1). Numbers are pillar/chain-link indexes.
          pillar-locations: {}
          chain-link-locations: {}
          crate-spawner-locations: []
          stalactite-locations: []
          mob-wave-spawn-locations: []
          stalactite-push-percent: 10.0
          stalactite-explosion-percent: 10.0
          # Mob waves spawn 5 miner skeletons + 1 random miniboss at a random
          # configured mob-wave-spawn-location every interval.
          mob-wave-interval-ticks: 200
          mob-wave-level: 1
          ground-material: BLACK_CONCRETE
          wipe-stage: wipe
        - type: WIPE
          id: wipe
          duration-ticks: 240
          kill-ticks: 200
          pull-ticks: 60
          draw-ticks: 80
          rise-start-ticks: 40
          rise-ticks: 70
          grip-start-ticks: 140
          grip-ticks: 50
          radius: 8.0
          hover-height: 6.5
          hand-depth: 3.0
          hand-height: 6.0
          kill-players: true
          hand-material: SCULK
          message: "§4The seal shatters. The Sealed Hand claims the party."

  # Test floor: Wither King is kept for spawn/reload testing, not the Floor 1 boss.
  99:
    wither-king:
      display-name: "&c&lWither King"
      entity-type: WITHER
      defeat-stage: death
      stats:
        HEALTH_MAX: 15000
        MANA_MAX: 100
        ARMOR: 20
        MAGIC_RESIST: 20
        ATTACK_DAMAGE: 80
        ATTACK_SPEED: 1.0
        MOVE_SPEED: 100
        HEALTH_REGEN: 0
        MANA_REGEN: 0
        CRIT_CHANCE: 0.0
        LETHALITY: 0
        ARMOR_PENETRATION: 0
      stages:
        - type: THRESHOLD
          id: phase1
          health-threshold: 0.75
          next-stage: phase2
          targeting: FIRST_ALIVE
          movement: PATHFIND
          movement-speed: 1.2
          attack: WITHER_SKULL
          attack-count: 1
          attack-cooldown-ms: 1200
        - type: THRESHOLD
          id: phase2
          health-threshold: 0.0
          next-stage: death
          targeting: FIRST_ALIVE
          movement: PATHFIND
          movement-speed: 1.5
          attack: WITHER_SKULL
          attack-count: 2
          attack-cooldown-ms: 900
        - type: MONOLOGUE
          id: death
          tick-delay: 60
          lines:
            - "§cThe Wither King staggers... 'Impossible... you cannot defeat me!'"
            - "§c'The dungeon... will consume you all...'"
            - "§7The Wither King collapses into dust."
