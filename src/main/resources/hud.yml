# ============================================================================
# HUD OVERLAY CONFIGURATION
# ============================================================================
# The HUD uses per-key stacked TextDisplays in front of the player's eye.
# Health/Mana stays on the action bar (BukkitPlayerEntity); this file tunes
# the extra ability HUD (e.g. Hunter's Bow) and the "Not enough <resource>"
# feedback.
#
# distance       — forward from eye before vertical-offset is applied; raytraced
#                  against walls (min 0.4 after hit).
# vertical-offset— Y offset applied after forward projection.
# spacing        — vertical gap between stacked keys (priority-sorted).
# scale          — TextDisplay transformation scale.
# view-range     — max view distance scalar.
# line-width     — TextDisplay line width.
# background     — nested ARGB 0-255 each (alpha,r,g,b).
#                  legacy background-color: "#AARRGGBB" still parsed if nested absent.
# formats.hunter — allow '&' color codes, placeholders %dots%, %bounces%.
# formats.tri    — trinity bow: ready/volley strings, supports & codes.
# messages.not-enough — must contain <resource> placeholder; auto-colored via StatType.
# messages.on-cooldown  — shown when casting an ability on cooldown; supports the
#                  <ability> and <seconds> placeholders. The line fades out via
#                  text opacity across the trailing on-cooldown-fade-ms window.
# messages.on-cooldown-duration-ms — how long the cooldown line stays visible.
# max-keys       — maximum concurrent HUD fragments (TextDisplays) visible at
#                  once. Each ability pushes a keyed fragment (e.g.
#                  "hunter:bounce" prio10, "hunter:shock" prio20,
#                  "hud:resource"/"hud:cooldown" prio100 for warnings).
#                  Fragments are priority-sorted (higher first) and culled to
#                  this limit; excess lowest-priority keys are dropped until
#                  they expire. Range 1–8, default 4. Live-reloadable via
#                  /hud reload.
#
# tracking       — real-time follow tuning. The server observes a moving player
#                  ~1-2 ticks late, so plain per-tick teleports either stutter
#                  (no interpolation) or trail behind (interpolation). The HUD
#                  combines three techniques:
#   velocity-lead-ticks — anchors ahead of the observed position along the
#                  player's velocity to cancel that lag while moving
#                  (clamped to 1 block). 0 disables leading.
#   min-step    — movement delta below which no update is sent; avoids
#                  restarting client interpolation every tick (micro-stutter).
#   snap-distance — deltas beyond this are treated as teleports and hard-place
#                  the HUD instantly instead of gliding across the world.
#
# COLOR SYNTAX (all config strings here and in lore/chat configs):
#   legacy codes   &0-&9, &a-&f, &l &m &n &o &k &r
#   hex            &#RRGGBB   {#RRGGBB}   (#RRGGBB / 0xRRGGBB for color values)
#   rgb function   rgb(r,g,b) or &rgb(r,g,b), each component clamped 0-255
enabled: true
max-keys: 4
display:
  distance: 1.85
  vertical-offset: 0.75
  spacing: 0.28
  scale: 0.65
  view-range: 0.9
  line-width: 300
  background:
    alpha: 96
    r: 0
    g: 0
    b: 0
  brightness: 15
  interpolation-duration: 1
  teleport-duration: 2
  shadowed: true
  see-through: false
tracking:
  velocity-lead-ticks: 2.0
  min-step: 0.004
  snap-distance: 3.0
formats:
  hunter:
    bounce-zero: "&6Hunter's Bow &8| &7Bouncy %dots% &8(0/3) &7— plain"
    bounce: "&6Hunter's Bow &8| &bBouncy %dots% &7(%bounces%/3)"
    shock-armed: "&c◉ Shock Bolt ARMED &7— next arrow detonates"
    shock-plain: "&7○ Shock — plain  &8○ No shock"
  tri:
    ready: "&5Trinity Bow &8| &dHoming ready &7(3 &8× &7homing)"
    volley-ready: "&5Trinity &8| &dVolley ready"
    volley-cd: "&cVolley &7%cds"
  staff:
    mode1: "&2Utility Staff &8| &aMending Touch"
    mode2: "&2Utility Staff &8| &eAegis Ward"
    mode3: "&2Utility Staff &8| &bTempest Gust"
messages:
  not-enough: "&cNot enough <resource>!"
  # hex + rgb examples: "{#FFAA00}Volley" or "&#FF5555<ability> &8» rgb(255,85,85)On cooldown"
  on-cooldown: "&7<ability> &8» &cOn cooldown &7(<seconds>s)"
  on-cooldown-duration-ms: 1600
  on-cooldown-fade-ms: 600
