# ============================================================================
# ABILITIES CONFIGURATION
# ============================================================================
# Each entry under `abilities:` carries the game-facing metadata for an ability
# that is REGISTERED IN JAVA first (AbilityRegistry.preregister in DMain, e.g.
# dev.core.ability.impl.*). The yml only configures an already-registered id;
# unknown ids are skipped with a warning.
#
# Cooldowns and costs are CONFIG-ONLY: Java defines the behavior, this file
# defines the numbers. An ability with no `cooldown:` key has no cooldown, and
# one with no `cost:` key is free to cast.
#
# ----------------------------------------------------------------------------
# KEY REFERENCE (all keys optional unless noted)
# ----------------------------------------------------------------------------
#
#   name            Display name of the ability (defaults to the id). Used on
#                   item lore via BukkitLoreRenderer.
#
#   description     Lore lines shown on the item holding the ability. Tagged
#                   style is supported, e.g. <red>, <bold>, <aqua>, <blue>,
#                   <yellow>.
#
#   triggerType     MANUAL or AUTOMATIC (default MANUAL).
#                     MANUAL    cast when the holder performs the configured
#                               `action` (player clicks, mob casts).
#                     AUTOMATIC cast when the holder's registered trigger event
#                               fires (requires the Java Ability to define a
#                               trigger Event).
#
#   action          AbilityAction for MANUAL abilities: RIGHT_CLICK,
#                   LEFT_CLICK, SHIFT_RIGHT_CLICK, SHIFT_LEFT_CLICK, SHIFT,
#                   JUMP (default NONE). An item only casts when this matches
#                   the performed action, e.g. mobs trigger RIGHT_CLICK.
#
#   cooldownScope   PLAYER (per caster) or ITEM (per item instance) (default
#                   PLAYER).
#
#   cooldown        Cooldown in milliseconds (default 0).
#
#   cooldownScaling HASTE (default) or NONE. HASTE shortens the cooldown by the
#                   caster's ABILITY_HASTE stat; NONE applies the configured
#                   cooldown as-is.
#
#   cost            Optional cast cost (default: none). A "mode" (MANA or
#                   HEALTH) plus a price, given either as a flat "amount" or a
#                   dynamic "formula" (formula wins when both are set):
#
#                     # flat price:
#                     cost:
#                       mode: MANA
#                       amount: 25
#
#                     # dynamic price — evaluated against the CASTER at every
#                     # cast, so the same ability can cost different casters
#                     # different amounts:
#                     cost:
#                       mode: MANA
#                       formula: "10 + 0.05 * MANA_MAX"
#
#   targetsPlayer   MOB-CASTING ONLY, true by default. Whether a mob casting
#                   this ability needs a player target: true abilities only
#                   fire while a player is in range AND in line of sight (the
#                   mob faces the target); set false for self-targeted
#                   abilities (heals, buffs) that a mob should keep casting
#                   even with no player visible.
#
# ----------------------------------------------------------------------------
# COST FORMULAS
# ----------------------------------------------------------------------------
#
#   Syntax: numbers (decimals allowed), + - * / , parentheses, unary minus.
#   Standard precedence (* and / bind tighter than + and -).
#
#   Variables resolve against the casting entity at cast time,
#   case-insensitively:
#
#     <STAT_NAME>       Any stat from stats.yml by its key name:
#                       HEALTH_MAX, MANA_MAX, ARMOR, MAGIC_RESIST,
#                       ATTACK_DAMAGE, ABILITY_POWER, ATTACK_SPEED, LETHALITY,
#                       ARMOR_PENETRATION, CRIT_CHANCE, PROJECTILE_DAMAGE,
#                       MOVE_SPEED, HEALTH_REGEN, MANA_REGEN, ABILITY_HASTE,
#                       HEAL_AND_SHIELD_POWER, HEALTH_RESOURCE (current
#                       health), MANA_RESOURCE (current mana).
#     MANA_MISSING      Max mana minus current mana.
#     HEALTH_MISSING    Max health minus current health.
#
#   Examples:
#     "25"                      same as amount: 25
#     "0.05 * MANA_MAX"         5% of the caster's max mana
#     "10 + 0.1 * ABILITY_POWER"  10 plus 10% of ability power
#     "MANA_MISSING / 4"        a quarter of the mana the caster is missing
#
#   Error handling:
#     - Bad formula SYNTAX is reported at startup ("Bad cost config for
#       ability ...") and the ability is left WITHOUT a cost.
#     - An UNKNOWN VARIABLE refuses the individual cast at runtime with a
#       console warning; nothing is deducted.
#     - Formula results below zero are clamped to 0.
#
# ----------------------------------------------------------------------------
# WIRING & EXAMPLE
# ----------------------------------------------------------------------------
#
# The actual in-game behavior (projectiles, AoE, particles, ...) lives in the
# matching Bukkit Effect, wired to the same id in DMain.onEnable via
# AbilityRegistry.register(id, effectFactory); a yml entry without a registered
# effect fires nothing.
#
# Full example (copy into `abilities:` and rename to a registered id):
#
#   MY_ABILITY:
#     name: My Ability
#     description:
#     - "A line of <red>lore</red>."
#     triggerType: MANUAL
#     action: RIGHT_CLICK
#     cooldownScope: PLAYER
#     cooldown: 5000
#     cooldownScaling: HASTE
#     cost:
#       mode: MANA
#       formula: "10 + 0.05 * MANA_MAX"
#     targetsPlayer: true
# ============================================================================
abilities:
  BONE_SWING:
    name: Swing
    description:
      - "Throw the bone a short distance,"
      - "dealing the damage an arrow would."
      - ""
      - "Deals <red><bold>double damage</bold></red> when coming"
      - "back. Pierces up to <yellow>10</yellow> foes."
    triggerType: MANUAL
    action: RIGHT_CLICK
    cooldownScope: ITEM
    cooldown: 3000
  PARTICLE_TEST_ABILITY:
    name: Particle Test
    description:
    - "Tests Particles"
    triggerType: MANUAL
    action: RIGHT_CLICK
    cooldownScope: PLAYER
    cooldown: 0
  GUIDED_BAT:
    name: Guided Bat
    description:
      - "Shoots a guided bat in the direction"
      - "you are looking that explodes on impact,"
      - "dealing <aqua>Magic Damage</aqua> to all"
      - "nearby enemies."
      - ""
    triggerType: MANUAL
    action: RIGHT_CLICK
    cooldownScope: PLAYER
    cooldown: 0
    cost:
      mode: MANA
      amount: 25
  SPINJITZU:
    name: Spinjitzu
    description:
      - "Summon a cyclone of spinning rings"
      - "around you that pulls nearby enemies"
      - "into you for <yellow>10</yellow> seconds."
      - ""
      - "Re-activating while a cyclone is up"
      - "does nothing until it collapses."
    triggerType: MANUAL
    action: RIGHT_CLICK
    cooldownScope: ITEM
    cooldown: 3000
  SMASH:
    name: Smash
    description:
      - "Slam into the ground, sending out a"
      - "shockwave in a cone in front of you."
      - ""
      - "Enemies inside the cone are knocked"
      - "back and take damage scaling with"
      - "your <gray>Armor</gray> and <dark_purple>Magic Resist</dark_purple>."
    triggerType: MANUAL
    action: RIGHT_CLICK
    cooldownScope: ITEM
    cooldown: 5000
  SHIELD_BASH:
    name: Shield Bash
    description:
      - "Swing your shield through the"
      - "half-circle in front of you,"
      - "<yellow>stunning</yellow> every enemy"
      - "inside for <yellow>1.5</yellow> seconds."
    triggerType: MANUAL
    action: SHIFT_RIGHT_CLICK
    cooldownScope: ITEM
    cooldown: 3000
  SOUL_SUMMON:
    name: Soul Summon
    description:
      - "Summon every soul held in your tome"
      - "as <green>allies</green> that fight for"
      - "you. Souls are captured when your"
      - "team slays dungeon mobs."
    triggerType: MANUAL
    action: RIGHT_CLICK
    cooldownScope: PLAYER
    cooldown: 500
    cost:
      mode: MANA
      amount: 25
  SOUL_COLLECTOR:
    name: Soul Collector
    description:
      - "Walk into dropped souls to claim"
      - "them into your tome."
    triggerType: PASSIVE
    action: NONE
    cooldownScope: PLAYER
    cooldown: 0
  SOUL_RECALL:
    name: Soul Recall
    description:
      - "Recall every active summon to"
      - "your side."
    triggerType: MANUAL
    action: LEFT_CLICK
    cooldownScope: PLAYER
    cooldown: 2000
  SOUL_RECALL_SHIFT:
    name: Soul Store
    description:
      - "Dismiss every active summon and store"
      - "their souls back into your tome."
    triggerType: MANUAL
    action: SHIFT_RIGHT_CLICK
    cooldownScope: PLAYER
    cooldown: 2000
  SHADOW_STAFF_PLACE:
    name: Shadow Platform
    description:
      - "Right-click to conjure a shadow"
      - "platform at the crosshair. Up to <yellow>3</yellow>"
      - "platforms may exist at once; they"
      - "darken and fade away over <yellow>6</yellow> seconds."
      - ""
      - "Platforms must stay at least <yellow>3</yellow>"
      - "blocks apart."
    triggerType: MANUAL
    action: RIGHT_CLICK
    cooldownScope: PLAYER
    cooldown: 0
    cost:
      mode: MANA
      amount: 25
  SHADOW_STAFF_DASH:
    name: Shadow Dash
    description:
      - "Left-click while looking at a"
      - "highlighted platform to dash onto it."
      - ""
      - "Dashing between platforms chains"
      - "seamlessly; dropping off grants"
      - "brief <aqua>Invisibility</aqua> and <aqua>Slow Falling</aqua>,"
      - "arming a <red>Plunge Strike</red> for 3 seconds."
    triggerType: MANUAL
    action: LEFT_CLICK
    cooldownScope: PLAYER
    cooldown: 0
  FOCUS_BEAM:
    name: Focus Beam
    description:
      - "Charge your focus, then release a"
      - "searing arcane beam that deals"
      - "<aqua>Magic Damage</aqua> every tick to the"
      - "first enemy in your sights."
      - ""
      - "Right-click again while the beam"
      - "is up to cancel it (the cancelling"
      - "click is free)."
    triggerType: MANUAL
    action: RIGHT_CLICK
    cooldownScope: PLAYER
    cooldown: 0
    cost:
      mode: MANA
      amount: 50
  BOUNCY_ARROWS:
    name: Bouncy Arrows
    description:
      - "Shift while drawing your bow to"
      - "charge up to <yellow>3</yellow> bounces into"
      - "your next arrow."
      - ""
      - "- Each shift adds <aqua>1 bounce</aqua>,"
      - "wrapping back to <gray>0</gray> at max."
      - "- Charged arrows <aqua>ricochet</aqua> off"
      - "blocks until charges are spent."
    triggerType: MANUAL
    action: SHIFT
    cooldownScope: PLAYER
    cooldown: 0
  EXPLOSIVE_ARROWS:
    name: Shock Bolt
    description:
      - "Left-click to arm your next arrow"
      - "with a <red>shock charge</red>."
      - ""
      - "- Explodes once all bounces are"
      - "used up, or on first impact if"
      - "uncharged."
      - "- <gray>Sova-inspired ordnance.</gray>"
    triggerType: MANUAL
    action: LEFT_CLICK
    cooldownScope: PLAYER
    cooldown: 400